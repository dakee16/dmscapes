# Once Vercel reports a production deployment live, tell IndexNow which pages changed since the
# previous production deployment (scripts/indexnow.mjs maps changed files to URLs). Vercel posts
# deployment statuses to GitHub; previews are skipped. Nothing here fetches dormscape.us.
name: IndexNow

on: deployment_status

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Find the previous production deployment
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          THIS: ${{ github.event.deployment.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=50" \
            --jq ".[] | select(.id < $THIS) | \"\(.id) \(.sha)\"" |
          while read -r id sha; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq 'any(.[]; .state == "success")')" = true ]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Previous production deployment: $sha"
              break
            fi
          done

      - name: Ping IndexNow with the changed URLs
        if: steps.prev.outputs.sha != ''
        run: node scripts/indexnow.mjs "${{ steps.prev.outputs.sha }}" "${{ github.event.deployment.sha }}"
